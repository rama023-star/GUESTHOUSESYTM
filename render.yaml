services:
  - type: web
    name: guestflow
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python deploy_init.py && gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: guestflow-db
          property: connectionString
      - key: BOOTSTRAP_ADMIN_NAME
        value: GuestFlow Admin
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CURRENCY_CODE
        value: UGX
      - key: TIMEZONE
        value: Africa/Kampala
      - key: COOKIE_SECURE
        value: "1"

databases:
  - name: guestflow-db
    databaseName: guestflow
    user: guestflow
    plan: free
    region: singapore
